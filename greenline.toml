# greenline gate configuration — committed to the repo.
# See docs/greenline.md and DOCTRINE.md for the workflow and invariants.
contract_version = 1
main_branch = "main"

# Verdict command. cwd = the worktree being gated. Start with all useful,
# relevant verification that fits in 3 minutes; use changed paths and transitive
# impact to prove coverage of affected behavior against a TEST datastore.
# Preserve relevant coverage; run broader/external suites only when intentionally
# relevant. Product growth must not increase standard release time. Exit nonzero
# on any relevant failure; support concurrent worktrees.
check = "./run check"

# Deploy command. cwd = the canonical checkout. Must rebuild/restart prod,
# health-check, exit nonzero on unhealthy, and be idempotent (safe to re-run).
deploy = "./run deploy"

# Optional health-only probe. Empty = re-run `deploy` as the health probe.
health = ""

# Informational: the auto/service name this repo deploys.
service = "book-reader"

# Persistent worktree base for this repo (gate lives at <base>/gate).
worktree_base = "/Volumes/Gumby/worktrees/greenline/book-reader"

# Legacy compatibility only. Greenline always deploys every successful release.
# coalesce_deploys = false
